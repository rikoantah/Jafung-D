<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Data Jabfung</title>

<style>

:root{

  --blue:#2563eb;
  --sky:#0ea5e9;
  --green:#16a34a;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;

}

*{
  box-sizing:border-box;
}

body{

  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);

}

.header{

  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  color:white;
  padding:25px;
  text-align:center;

}

.header h1{

  margin:0;
  font-size:28px;

}

.main{

  max-width:800px;
  margin:auto;
  padding:20px;

}

.card{

  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  border:1px solid var(--border);
  box-shadow:0 5px 15px rgba(0,0,0,0.08);

}

.nama{

  font-size:18px;
  font-weight:bold;
  color:var(--blue);

}

.nip{

  margin-top:5px;
  color:var(--muted);

}

.catatan{

  margin-top:12px;
  padding:12px;
  background:#f1f5f9;
  border-radius:10px;
  line-height:1.5;

}

.folder{

  display:inline-block;
  margin-top:15px;
  text-decoration:none;
  background:var(--green);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:bold;

}

.loading{

  text-align:center;
  padding:30px;

}

</style>

</head>

<body>

<div class="header">

  <h1>Data Jabfung</h1>

  <p>Daftar Pengajuan Jabatan Fungsional</p>

</div>

<div class="main">

  <div id="container">

    <div class="loading">

      Memuat data...

    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwQPh8B_Vpq1yOmaipDfjPu60uIqzji9y3PtdbGt2aqaO4_z4iq5yRYZRY2idB6tjyT/exec";

async function loadData() {

  const container =
    document.getElementById("container");

  try {

    const response =
      await fetch(API_URL);

    const data =
      await response.json();

    container.innerHTML = "";

    data.forEach(item => {

      container.innerHTML += `

        <div class="card">

          <div class="nama">

            ${item.nama}

          </div>

          <div class="nip">

            NIP: ${item.nip}

          </div>

          <div class="catatan">

            ${item.catatan || "-"}

          </div>

          <a class="folder"
             href="${item.folder}"
             target="_blank">

             Buka Folder

          </a>

        </div>

      `;

    });

  } catch (error) {

    container.innerHTML =

      "<div class='loading'>Gagal memuat data.</div>";

    console.log(error);

  }

}

loadData();

</script>

</body>

</html>
